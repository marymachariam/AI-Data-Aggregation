services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aggre8_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aggre8_db
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/chroma_data:/app/chroma_data
      - ./Backend/credentials.json:/app/credentials.json

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data: